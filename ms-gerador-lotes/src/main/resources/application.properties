spring.application.name=ms-gerador-lotes

# Porta aleatoria: permite varias instancias do mesmo microsservico
server.port=0

# Eureka (registro/descoberta)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# MySQL proprio do microsservico (docker-compose: servico mysql-gerador, porta 3307 no host)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/gerador_lotes_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Schema gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# API publica externa ViaCEP
viacep.url=https://viacep.com.br/ws
spring.cloud.openfeign.client.config.viacep.connect-timeout=3000
spring.cloud.openfeign.client.config.viacep.read-timeout=5000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
