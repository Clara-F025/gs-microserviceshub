spring.application.name=ms-coleta-impacto

# Porta aleatoria: permite varias instancias do mesmo microsservico
server.port=0

# Eureka (registro/descoberta)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# MySQL proprio do microsservico (docker-compose: servico mysql-coleta, porta 3308 no host)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/coleta_impacto_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Schema gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=60
spring.flyway.connect-retries-interval=2

# Feign (cliente do ms-gerador-lotes resolvido via Eureka + Load Balancer)
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Resilience4j - Circuit Breaker (instancia "geradorLotes", usada com @CircuitBreaker)
resilience4j.circuitbreaker.instances.geradorLotes.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.geradorLotes.slidingWindowSize=5
resilience4j.circuitbreaker.instances.geradorLotes.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.geradorLotes.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geradorLotes.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.geradorLotes.permittedNumberOfCallsInHalfOpenState=2
# Erros de negocio (404/400/409) nao representam falha do servico remoto
resilience4j.circuitbreaker.instances.geradorLotes.ignoreExceptions=\
  com.github.clara_f025.ms_coleta_impacto.exceptions.BusinessRuleException,\
  com.github.clara_f025.ms_coleta_impacto.exceptions.ResourceNotFoundException,\
  com.github.clara_f025.ms_coleta_impacto.exceptions.ConflictException

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
